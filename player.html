<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>NexURL-Extractor — Player</title>
<link rel="stylesheet" href="player.css" />
</head>
<body>
  <div id="stage">
    <video id="video" playsinline></video>

    <div id="centerPlay" class="centerPlay"></div>
    <div id="spinner" class="spinner"></div>
    <div id="status"></div>

    <div id="controls" class="controls">
      <div id="seek" class="seek" role="slider" tabindex="0" aria-label="Seek" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div class="seekTrack"></div>
        <div id="seekBuffered" class="seekBuffered"></div>
        <div id="seekPlayed" class="seekPlayed"></div>
        <div id="seekHandle" class="seekHandle"></div>
      </div>

      <div class="controlsRow">
        <button id="playBtn" class="ctrlBtn" aria-label="Play"></button>
        <button id="backBtn" class="ctrlBtn" aria-label="Back 10 seconds"></button>
        <button id="fwdBtn" class="ctrlBtn" aria-label="Forward 10 seconds"></button>

        <div class="volGroup" id="volGroup">
          <button id="muteBtn" class="ctrlBtn" aria-label="Mute"></button>
          <div class="volSlider">
            <input id="volRange" type="range" min="0" max="1" step="0.05" value="1" aria-label="Volume" />
          </div>
        </div>

        <span id="timeDisplay" class="timeDisplay">0:00 <span class="sep">/</span> 0:00</span>

        <div class="spacer"></div>

        <div class="settingsWrap">
          <button id="settingsBtn" class="ctrlBtn" aria-label="Settings"></button>
          <div id="settingsMenu" class="settingsMenu">
            <div class="settingsLabel">Speed</div>
            <div id="speedOptions" class="settingsSection"></div>
            <div class="settingsLabel" id="qualityLabel">Quality</div>
            <div id="qualityOptions" class="settingsSection"></div>
            <div class="settingsLabel">Link</div>
            <div id="linkOptions" class="settingsSection">
              <button id="copySrcBtn" class="settingsOpt">📋 Copy stream URL</button>
              <button id="copyRefBtn" class="settingsOpt" style="display:none;">📋 Copy referer URL</button>
            </div>
          </div>
        </div>

        <button id="fsBtn" class="ctrlBtn" aria-label="Fullscreen"></button>
      </div>
    </div>
  </div>

  <script src="vendor/hls.min.js"></script>
  <script src="player.js"></script>
</body>
</html>
